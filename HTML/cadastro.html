<main>

    <h1>Cadastre-se</h1>

    <p>
        Preencha seus dados para fazer parte das ações da VivaLaço.
    </p>

    <form aria-label="Formulário de cadastro">

        <label for="nome">Nome completo:</label>

        <input
            type="text"
            id="nome"
            name="nome"
            required
        >

        <label for="email">E-mail:</label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="cpf">CPF:</label>

        <input
            type="text"
            id="cpf"
            name="cpf"
            required
            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
            placeholder="000.000.000-00"
        >

        <label for="telefone">Telefone:</label>

        <input
            type="tel"
            id="telefone"
            name="telefone"
            required
            pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
            placeholder="(11) 99999-9999"
        >

        <label for="cep">CEP:</label>

        <input
            type="text"
            id="cep"
            name="cep"
            required
            pattern="[0-9]{5}-[0-9]{3}"
            placeholder="00000-000"
        >

        <label for="endereco">Endereço:</label>

        <input
            type="text"
            id="endereco"
            name="endereco"
            required
        >

        <label for="numero">Número:</label>

        <input
            type="number"
            id="numero"
            name="numero"
            required
        >

        <label for="cidade">Cidade:</label>

        <input
            type="text"
            id="cidade"
            name="cidade"
            required
        >

        <label for="estado">Estado:</label>

        <input
            type="text"
            id="estado"
            name="estado"
            required
            maxlength="2"
            placeholder="SP"
        >

        <p>Como você deseja participar?</p>

        <label>
            <input
                type="radio"
                name="participacao"
                value="voluntario"
                required
            >
            Voluntariado
        </label>

        <label>
            <input
                type="radio"
                name="participacao"
                value="doador"
            >
            Doação
        </label>

        <p>Quais atividades você tem interesse?</p>

        <label>
            <input
                type="checkbox"
                name="interesse"
                value="campanhas"
            >
            Campanhas solidárias
        </label>

        <label>
            <input
                type="checkbox"
                name="interesse"
                value="eventos"
            >
            Eventos
        </label>

        <label>
            <input
                type="checkbox"
                name="interesse"
                value="arrecadacao"
            >
            Arrecadação de doações
        </label>

        <label for="dataNascimento">
            Data de nascimento:
        </label>

        <input
            type="date"
            id="dataNascimento"
            name="dataNascimento"
            required
        >

        <label for="mensagem">
            Mensagem:
        </label>

        <textarea
            id="mensagem"
            name="mensagem"
            rows="5"
            cols="40"
        ></textarea>

        <button type="submit">
            Enviar cadastro
        </button>

    </form>

</main>
